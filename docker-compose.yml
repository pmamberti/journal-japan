services:
  backend:
    build: ./backend
    container_name: japan-journal-backend
    restart: unless-stopped
    # ports:
    #   - "8000:8000"  # Uncomment for direct access
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=/app/data/journal.db
      - UPLOAD_DIR=/app/uploads
      - AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.japan-journal-api.rule=Host(`japan.mambertibognolo.it`) && PathPrefix(`/api`)"
      - "traefik.http.routers.japan-journal-api.entrypoints=websecure"
      - "traefik.http.routers.japan-journal-api.tls=true"
      - "traefik.http.routers.japan-journal-api.tls.certresolver=myresolver"
      - "traefik.http.services.japan-journal-api.loadbalancer.server.port=8000"
    networks:
      - homelab

  frontend:
    build: ./frontend
    container_name: japan-journal-frontend
    restart: unless-stopped
    # ports:
    #   - "8010:80"  # Uncomment for direct access
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.japan-journal.rule=Host(`japan.mambertibognolo.it`)"
      - "traefik.http.routers.japan-journal.entrypoints=websecure"
      - "traefik.http.routers.japan-journal.tls=true"
      - "traefik.http.routers.japan-journal.tls.certresolver=myresolver"
      - "traefik.http.services.japan-journal.loadbalancer.server.port=80"
      # HTTP redirect to HTTPS
      - "traefik.http.routers.japan-journal-http.rule=Host(`japan.mambertibognolo.it`)"
      - "traefik.http.routers.japan-journal-http.entrypoints=web"
      - "traefik.http.routers.japan-journal-http.middlewares=japan-journal-redirect"
      - "traefik.http.middlewares.japan-journal-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.japan-journal-redirect.redirectscheme.permanent=true"
    networks:
      - homelab

networks:
  homelab:
    external: true

volumes:
  data:
  uploads:
