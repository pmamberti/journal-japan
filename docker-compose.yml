version: '3.8'

services:
  backend:
    build: ./backend
    container_name: japan-journal-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=/app/data/journal.db
      - UPLOAD_DIR=/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.japan-journal-api.rule=Host(`${DOMAIN:-japan.yourdomain.com}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.japan-journal-api.entrypoints=websecure"
      - "traefik.http.routers.japan-journal-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.japan-journal-api.loadbalancer.server.port=8000"
    networks:
      - traefik

  frontend:
    build: ./frontend
    container_name: japan-journal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.japan-journal.rule=Host(`${DOMAIN:-japan.yourdomain.com}`)"
      - "traefik.http.routers.japan-journal.entrypoints=websecure"
      - "traefik.http.routers.japan-journal.tls.certresolver=letsencrypt"
      - "traefik.http.services.japan-journal.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  data:
  uploads:
